{{ define "teste_certificado" }}
<div class="flash flash-{{ .Classe }}" style="font-size: 13px; line-height: 1.6;">
  <div style="font-weight: 700; font-size: 14px; margin-bottom: 6px;">{{ .Titulo }}</div>
  {{ if .Mensagem }}<div>{{ .Mensagem }}</div>{{ end }}
  {{ range .Itens }}
    <div><strong>{{ .Rotulo }}:</strong> {{ .Valor }}</div>
  {{ end }}
  {{ if .Nota }}<div style="margin-top: 6px; color: var(--text-2); font-size: 12px;">{{ .Nota }}</div>{{ end }}
</div>
{{ end }}
